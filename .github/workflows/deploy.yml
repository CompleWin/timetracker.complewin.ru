name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      app-url:
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.app-url }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
      APP_URL: ${{ inputs.app-url }}
      PUBLISHER_NAME: ${{ vars.PUBLISHER_NAME }}
      SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run deploy:${{ inputs.environment }} -w @stt/api -- --dry-run
      - run: npm run db:migrate:${{ inputs.environment }}
      - run: npm run deploy:${{ inputs.environment }} -w @stt/api
      - name: Smoke check
        env:
          EXPECTED_ENV: ${{ inputs.environment }}
        run: |
          body=$(curl --fail --silent --show-error --retry 10 --retry-delay 10 --retry-all-errors "${APP_URL%/}/api/health")
          echo "$body"
          test "$(jq -r .env <<< "$body")" = "$EXPECTED_ENV"
          test "$(jq -r .publisherName <<< "$body")" = "$PUBLISHER_NAME"
          test "$(jq -r .supportEmail <<< "$body")" = "$SUPPORT_EMAIL"
