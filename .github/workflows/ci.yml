name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Dry-run staging on workers.dev
        env:
          APP_URL: https://stt-staging.example.workers.dev
          PUBLISHER_NAME: Example publisher
          SUPPORT_EMAIL: support@example.com
        run: npm run deploy:staging -w @stt/api -- --dry-run
      - name: Dry-run production on a custom domain
        env:
          APP_URL: https://tracker.example.com
          PUBLISHER_NAME: Example publisher
          SUPPORT_EMAIL: support@example.com
        run: npm run deploy:production -w @stt/api -- --dry-run
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/test-results/
          if-no-files-found: ignore
